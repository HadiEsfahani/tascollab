  let activeProject = 'ecoro';
  let projectStore = JSON.parse(JSON.stringify(DEFAULT_DATABASE));

  function init() {
// 1. Try local storage cache
const cached = localStorage.getItem('projects_cache');
if (cached) {
try {
const parsed = JSON.parse(cached);
projectStore = { ...projectStore, ...parsed };
} catch(e) {}
}
loadProjectToForm(activeProject);
fetchFromSupabase();
  }

  async function fetchFromSupabase() {
if (!supabase) return;
try {
const { data, error } = await supabase.from('project_configs').select('*');
if (data && !error && data.length > 0) {
data.forEach(item => {
projectStore[item.id] = { ...projectStore[item.id], ...item };
});
localStorage.setItem('projects_cache', JSON.stringify(projectStore));
loadProjectToForm(activeProject);
setStatus('Synced with live Supabase database.', 'success');
}
} catch(err) {
console.warn('Supabase offline or unreachable. Using cache/default.', err);
}
  }

  function switchProject(id) {
saveFormToActiveObject();
activeProject = id;
document.querySelectorAll('.tab-btn').forEach(btn => {
btn.classList.toggle('active', btn.textContent.toLowerCase().includes(id));
});
loadProjectToForm(id);
  }

  function loadProjectToForm(id) {
const p = projectStore[id];
document.getElementById('p_name').value = p.name || '';
document.getElementById('p_badge').value = p.badge || '';
document.getElementById('p_progress').value = p.progress || 0;
document.getElementById('p_wallet').value = p.wallet || '';
document.getElementById('p_tagline').value = p.tagline || '';
document.getElementById('p_cover').value = p.cover || '';

// Stats
document.getElementById('p_stat_donated').value = p.stats?.donated || '';
document.getElementById('p_stat_top_donator').value = p.stats?.topDonator || '';
document.getElementById('p_stat_top_contrib').value = p.stats?.topContributor || '';
document.getElementById('p_stat_started').value = p.stats?.started || '';
document.getElementById('p_stat_contributors_cnt').value = p.stats?.contributorsCount || 0;

renderRoadmap(p.roadmap || []);
renderNeeds(p.needs || []);
renderTimeline(p.timeline || []);
renderContributions(p.contributions || []);
  }

  function saveFormToActiveObject() {
const p = projectStore[activeProject];
p.name = document.getElementById('p_name').value;
p.badge = document.getElementById('p_badge').value;
p.progress = parseInt(document.getElementById('p_progress').value) || 0;
p.wallet = document.getElementById('p_wallet').value;
p.tagline = document.getElementById('p_tagline').value;
p.cover = document.getElementById('p_cover').value;

p.stats = {
donated: document.getElementById('p_stat_donated').value,
topDonator: document.getElementById('p_stat_top_donator').value,
topContributor: document.getElementById('p_stat_top_contrib').value,
started: document.getElementById('p_stat_started').value,
contributorsCount: parseInt(document.getElementById('p_stat_contributors_cnt').value) || 0
};
  }

  // --- ROADMAP HANDLERS ---
  function renderRoadmap(items) {
const box = document.getElementById('roadmapContainer');
box.innerHTML = '';
items.forEach((item, index) => {
box.innerHTML += `
<div class="item-box">
<button type="button" class="del-btn" onclick="removeRoadmap(${index})">Remove</button>
<div class="grid-2">
<div class="form-group">
<label>Phase Title</label>
<input type="text" value="${item.title}" onchange="projectStore['${activeProject}'].roadmap[${index}].title = this.value">
</div>
<div class="form-group">
<label>Status</label>
<select onchange="projectStore['${activeProject}'].roadmap[${index}].status = this.value">
<option value="done" ${item.status === 'done' ? 'selected' : ''}>Done (✓)</option>
<option value="current" ${item.status === 'current' ? 'selected' : ''}>In Progress (• Active)</option>
<option value="upcoming" ${item.status === 'upcoming' ? 'selected' : ''}>Upcoming</option>
</select>
</div>
</div>
</div>
`;
});
  }
  function addRoadmapItem() {
projectStore[activeProject].roadmap.push({ title: 'New Phase', status: 'upcoming' });
renderRoadmap(projectStore[activeProject].roadmap);
  }
  function removeRoadmap(i) {
projectStore[activeProject].roadmap.splice(i, 1);
renderRoadmap(projectStore[activeProject].roadmap);
  }

  // --- NEEDS HANDLERS ---

box.innerHTML = '';
items.forEach((item, index) => {
box.innerHTML += `
<div class="item-box">

<div class="grid-2">
<div class="form-group">
<label>Task Title</label>
<input type="text" value="${item.title}" onchange="projectStore['${activeProject}'].needs[${index}].title = this.value">
