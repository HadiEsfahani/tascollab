<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS Admin Panel | Projects Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; }
    input, textarea, select { background-color: #0d1117 !important; border: 1px solid #30363d !important; color: #e6edf3 !important; }
    input:focus, textarea:focus { border-color: #58a6ff !important; outline: none; }
  </style>
</head>
<body class="p-6 max-w-6xl mx-auto">
  <header class="flex justify-between items-center pb-6 border-b border-gray-800 mb-8">
    <div>
      <h1 class="text-2xl font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-sliders text-blue-400"></i> Website Content Manager
      </h1>
      <p class="text-sm text-gray-400">Changes saved here will reflect immediately on the main page.</p>
    </div>
    <div class="flex gap-3">
      <a href="index.html" target="_blank" class="px-4 py-2 text-sm bg-gray-800 hover:bg-gray-700 text-white rounded-lg flex items-center gap-2">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> View Site
      </a>
      <button onclick="saveAllContent()" class="px-5 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow-lg flex items-center gap-2 transition">
        <i class="fa-solid fa-floppy-disk"></i> Save All Changes
      </button>
    </div>
  </header>

  <div id="statusToast" class="hidden fixed top-5 right-5 px-4 py-3 rounded shadow-lg text-white font-medium z-50"></div>

  <!-- General Settings Section -->
  <div class="card p-6 mb-8">
    <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2 border-b border-gray-800 pb-2">
      <i class="fa-solid fa-globe text-indigo-400"></i> General & Header Info
    </h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Website Title</label>
        <input type="text" id="siteTitle" class="w-full p-2 rounded text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Header Headline</label>
        <input type="text" id="headerTitle" class="w-full p-2 rounded text-sm" />
      </div>
      <div class="md:col-span-2">
        <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Header Subtitle</label>
        <textarea id="headerSubtitle" rows="2" class="w-full p-2 rounded text-sm"></textarea>
      </div>
    </div>
  </div>

  <!-- Projects Container -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold text-white">Managed Projects</h2>
    <button onclick="addNewProject()" class="px-3 py-1.5 text-xs bg-blue-600 hover:bg-blue-500 text-white rounded font-medium flex items-center gap-1">
      <i class="fa-solid fa-plus"></i> Add Project
    </button>
  </div>
  <div id="projectsContainer" class="space-y-6"></div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let siteData = {
      title: "Projects Showcase | Open Innovation",
      headerTitle: "Active Projects & Innovation Lab",
      headerSubtitle: "Explore work-in-progress hardware & software initiatives. Contribute insights or donate to earn PAC rewards.",
      projects: []
    };

    async function loadContent() {
      try {
        const { data, error } = await supabase.from('site_config').select('data').eq('id', 'main_content').single();
        if (data && data.data) {
          siteData = data.data;
        }
      } catch (e) {
        console.warn('Loading fallback data:', e);
      }
      renderEditor();
    }

    function renderEditor() {
      document.getElementById('siteTitle').value = siteData.title || '';
      document.getElementById('headerTitle').value = siteData.headerTitle || '';
      document.getElementById('headerSubtitle').value = siteData.headerSubtitle || '';

      const container = document.getElementById('projectsContainer');
      container.innerHTML = '';

      (siteData.projects || []).forEach((proj, pIdx) => {
        const card = document.createElement('div');
        card.className = 'card p-6 space-y-4';
        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-gray-800 pb-3">
            <span class="text-base font-bold text-white flex items-center gap-2">
              <span class="bg-blue-900/60 text-blue-400 px-2 py-0.5 rounded text-xs">${proj.badge || 'PROJ'}</span>
              Project #${pIdx + 1}: ${proj.title || 'Untitled'}
            </span>
            <button onclick="removeProject(${pIdx})" class="text-xs text-rose-400 hover:text-rose-300">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Title</label>
              <input type="text" value="${proj.title || ''}" onchange="siteData.projects[${pIdx}].title = this.value" class="w-full p-2 text-sm rounded">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Badge Abbr (e.g. EC)</label>
              <input type="text" value="${proj.badge || ''}" onchange="siteData.projects[${pIdx}].badge = this.value" class="w-full p-2 text-sm rounded">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Progress (%)</label>
              <input type="number" min="0" max="100" value="${proj.progress || 0}" onchange="siteData.projects[${pIdx}].progress = parseInt(this.value)" class="w-full p-2 text-sm rounded">
            </div>
            <div class="md:col-span-2">
              <label class="block text-xs text-gray-400 mb-1">Cover Image URL</label>
              <input type="text" value="${proj.bgImage || ''}" onchange="siteData.projects[${pIdx}].bgImage = this.value" class="w-full p-2 text-sm rounded">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">PAC Wallet Address</label>
              <input type="text" value="${proj.wallet || ''}" onchange="siteData.projects[${pIdx}].wallet = this.value" class="w-full p-2 text-sm rounded">
            </div>
            <div class="md:col-span-3">
              <label class="block text-xs text-gray-400 mb-1">Short Description</label>
              <textarea rows="2" onchange="siteData.projects[${pIdx}].description = this.value" class="w-full p-2 text-sm rounded">${proj.description || ''}</textarea>
            </div>
          </div>

          <!-- JSON Deep Config for Tasks, Roadmap & Timeline -->
          <details class="pt-2">
            <summary class="text-xs text-indigo-400 cursor-pointer hover:underline font-mono">Advanced: Roadmap, Tasks & Timeline (JSON Data)</summary>
            <div class="mt-2">
              <textarea id="adv_json_${pIdx}" rows="6" class="w-full font-mono text-xs p-3 rounded" onchange="updateProjectJson(${pIdx}, this.value)">${JSON.stringify(proj.dashboardData || {}, null, 2)}</textarea>
            </div>
          </details>
        `;
        container.appendChild(card);
      });
    }

    function updateProjectJson(idx, jsonStr) {
      try {
        siteData.projects[idx].dashboardData = JSON.parse(jsonStr);
      } catch(e) {
        alert('Invalid JSON in Project #' + (idx + 1));
      }
    }

    function addNewProject() {
      siteData.projects.push({
        id: 'proj_' + Date.now(),
        badge: 'NEW',
        title: 'New Project',
        progress: 0,
        description: 'Project description here...',
        wallet: 'PAC-EXAMPLE-ADDRESS',
        bgImage: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1600&q=80',
        dashboardData: { roadmap: [], tasks: [], timeline: [] }
      });
      renderEditor();
    }

    function removeProject(idx) {
      if (confirm('Delete this project?')) {
        siteData.projects.splice(idx, 1);
        renderEditor();
      }
    }

    async function saveAllContent() {
      siteData.title = document.getElementById('siteTitle').value;
      siteData.headerTitle = document.getElementById('headerTitle').value;
      siteData.headerSubtitle = document.getElementById('headerSubtitle').value;

      showToast('Saving changes...', 'bg-blue-600');
      const { error } = await supabase.from('site_config').upsert({
        id: 'main_content',
        data: siteData,
        updated_at: new Date()
      });

      if (!error) {
        showToast('All changes saved successfully!', 'bg-emerald-600');
      } else {
        showToast('Error saving: ' + error.message, 'bg-rose-600');
      }
    }

    function showToast(msg, bg) {
      const toast = document.getElementById('statusToast');
      toast.className = `fixed top-5 right-5 px-4 py-3 rounded shadow-lg text-white font-medium z-50 ${bg}`;
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    loadContent();
  </script>
</body>
</html>
