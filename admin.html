<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Project Manager</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 24px; color: #fff; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 14px; color: var(--accent); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    input, textarea, select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 10px; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 80px; resize: vertical; }
    .repeater-item { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .repeater-item input { flex: 1; }
    .btn { background: var(--accent); color: #000; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--accent-hover); }
    .btn-danger { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 12px; }
    .btn-sm { padding: 6px 12px; font-size: 12px; background: rgba(255,255,255,0.1); color: #fff; }
    .status-msg { margin-left: 12px; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Project Settings Admin</h1>
    <div>
      <button class="btn" onclick="saveCurrentProject()">Save Changes to Supabase</button>
      <span id="saveStatus" class="status-msg"></span>
    </div>
  </header>

  <div class="tabs" id="projectTabs">
    <button class="tab-btn active" onclick="switchProject('ecoro')">E-CORO</button>
    <button class="tab-btn" onclick="switchProject('aimee')">AIMEE</button>
    <button class="tab-btn" onclick="switchProject('march')">MARCH</button>
  </div>

  <div id="editorContent">
    <!-- General Info -->
    <div class="card">
      <h2>General Information</h2>
      <div class="grid">
        <div class="form-group">
          <label>Project Name</label>
          <input type="text" id="proj_name">
        </div>
        <div class="form-group">
          <label>Badge</label>
          <input type="text" id="proj_badge">
        </div>
      </div>
      <div class="form-group">
        <label>Tagline</label>
        <input type="text" id="proj_tagline">
      </div>
      <div class="form-group">
        <label>Cover Image URL</label>
        <input type="text" id="proj_cover">
      </div>
    </div>

    <!-- Stats -->
    <div class="card">
      <h2>Project Statistics</h2>
      <div id="statsList"></div>
      <button class="btn-sm" onclick="addStatRow()">+ Add Stat</button>
    </div>

    <!-- Roadmap -->
    <div class="card">
      <h2>Roadmap Phases</h2>
      <div id="roadmapList"></div>
      <button class="btn-sm" onclick="addRoadmapRow()">+ Add Phase</button>
    </div>

    <!-- Timeline & Events -->
    <div class="card">
      <h2>Recent Milestones (Timeline)</h2>
      <div id="timelineList"></div>
      <button class="btn-sm" onclick="addTimelineRow()">+ Add Milestone</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://druoddpcdykwjtntffjc.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // همان کلید موجود در index.html
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let activeProject = 'ecoro';
  let projectStore = {};

  // بارگذاری داده‌ها در پنل ادمین
  async function initAdmin() {
    // خواندن از دیتابیس یا استفاده از کش محلی
    try {
      const { data } = await supabase.from('project_configs').select('*');
      if (data && data.length) {
        data.forEach(item => { projectStore[item.id] = item.data; });
      }
    } catch(e) {
      console.warn("Couldn't fetch from DB, reading local/default");
    }

    // لود اولیه در فرم
    loadProjectIntoForm(activeProject);
  }

  function switchProject(key) {
    activeProject = key;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent.toLowerCase().includes(key));
    });
    loadProjectIntoForm(key);
  }

  function loadProjectIntoForm(key) {
    // خواندن از حافظه یا fallback به داده پیش‌فرض
    const data = projectStore[key] || {};
    document.getElementById('proj_name').value = data.name || '';
    document.getElementById('proj_badge').value = data.badge || '';
    document.getElementById('proj_tagline').value = data.tagline || '';
    document.getElementById('proj_cover').value = data.cover || '';

    // رندر آمارها
    const statsList = document.getElementById('statsList');
    statsList.innerHTML = '';
    (data.stats || []).forEach((s, idx) => {
      statsList.innerHTML += `
        <div class="repeater-item" data-idx="${idx}">
          <input type="text" placeholder="Label" value="${s.label}" class="stat-lbl">
          <input type="text" placeholder="Value" value="${s.value}" class="stat-val">
          <button class="btn btn-danger" onclick="this.parentElement.remove()">×</button>
        </div>`;
    });

    // رندر رودمپ
    const roadmapList = document.getElementById('roadmapList');
    roadmapList.innerHTML = '';
    (data.roadmap || []).forEach((r, idx) => {
      roadmapList.innerHTML += `
        <div class="repeater-item">
          <input type="text" placeholder="Phase (e.g. Phase 1)" value="${r.phase}" class="rd-phase" style="max-width:120px;">
          <input type="text" placeholder="Title" value="${r.title}" class="rd-title">
          <select class="rd-status" style="max-width:120px;">
            <option value="pending" ${r.status==='pending'?'selected':''}>Pending</option>
            <option value="active" ${r.status==='active'?'selected':''}>Active</option>
            <option value="done" ${r.status==='done'?'selected':''}>Done</option>
          </select>
          <button class="btn btn-danger" onclick="this.parentElement.remove()">×</button>
        </div>`;
    });

    // رندر تایم‌لاین
    const timelineList = document.getElementById('timelineList');
    timelineList.innerHTML = '';
    (data.timeline || []).forEach((t, idx) => {
      timelineList.innerHTML += `
        <div class="repeater-item">
          <input type="date" value="${t.date}" class="tm-date" style="max-width:140px;">
          <select class="tm-type" style="max-width:120px;">
            <option value="tested" ${t.type==='tested'?'selected':''}>Tested</option>
            <option value="designed" ${t.type==='designed'?'selected':''}>Designed</option>
            <option value="bought" ${t.type==='bought'?'selected':''}>Bought</option>
            <option value="donation" ${t.type==='donation'?'selected':''}>Donation</option>
          </select>
          <input type="text" placeholder="Description" value="${t.desc}" class="tm-desc">
          <button class="btn btn-danger" onclick="this.parentElement.remove()">×</button>
        </div>`;
    });
  }

  function addStatRow() {
    document.getElementById('statsList').insertAdjacentHTML('beforeend', `
      <div class="repeater-item">
        <input type="text" placeholder="Label" class="stat-lbl">
        <input type="text" placeholder="Value" class="stat-val">
        <button class="btn btn-danger" onclick="this.parentElement.remove()">×</button>
      </div>`);
  }

  function addRoadmapRow() {
    document.getElementById('roadmapList').insertAdjacentHTML('beforeend', `
      <div class="repeater-item">
        <input type="text" placeholder="Phase" class="rd-phase" style="max-width:120px;">
        <input type="text" placeholder="Title" class="rd-title">
        <select class="rd-status" style="max-width:120px;">
          <option value="pending">Pending</option>
          <option value="active">Active</option>
          <option value="done">Done</option>
        </select>
        <button class="btn btn-danger" onclick="this.parentElement.remove()">×</button>
      </div>`);
  }

  function addTimelineRow() {
    document.getElementById('timelineList').insertAdjacentHTML('beforeend', `
      <div class="repeater-item">
        <input type="date" class="tm-date" style="max-width:140px;">
        <select class="tm-type" style="max-width:120px;">
          <option value="tested">Tested</option>
          <option value="designed">Designed</option>
          <option value="bought">Bought</option>
        </select>
        <input type="text" placeholder="Description" class="tm-desc">
        <button class="btn btn-danger" onclick="this.parentElement.remove()">×</button>
      </div>`);
  }

  async function saveCurrentProject() {
    const status = document.getElementById('saveStatus');
    status.innerText = 'Saving...';

    // جمع‌آوری داده‌ها از فیلدها
    const stats = Array.from(document.querySelectorAll('#statsList .repeater-item')).map(el => ({
      label: el.querySelector('.stat-lbl').value,
      value: el.querySelector('.stat-val').value
    }));

    const roadmap = Array.from(document.querySelectorAll('#roadmapList .repeater-item')).map(el => ({
      phase: el.querySelector('.rd-phase').value,
      title: el.querySelector('.rd-title').value,
      status: el.querySelector('.rd-status').value
    }));

    const timeline = Array.from(document.querySelectorAll('#timelineList .repeater-item')).map(el => ({
      date: el.querySelector('.tm-date').value,
      type: el.querySelector('.tm-type').value,
      desc: el.querySelector('.tm-desc').value
    }));

    const updatedData = {
      name: document.getElementById('proj_name').value,
      badge: document.getElementById('proj_badge').value,
      tagline: document.getElementById('proj_tagline').value,
      cover: document.getElementById('proj_cover').value,
      stats,
      roadmap,
      timeline
    };

    projectStore[activeProject] = updatedData;

    try {
      const { error } = await supabase
        .from('project_configs')
        .upsert({ id: activeProject, data: updatedData, updated_at: new Date() });

      if (error) throw error;
      status.innerText = ' Saved successfully!';
      status.style.color = '#10b981';
      setTimeout(() => status.innerText = '', 3000);
    } catch(err) {
      status.innerText = '❌ Error saving: ' + err.message;
      status.style.color = '#ef4444';
    }
  }

  window.addEventListener('DOMContentLoaded', initAdmin);
</script>
</body>
</html>
