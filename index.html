<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects Showcase | Open Innovation</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f0f11;
      --card-bg: #16161a;
      --card-bg-hover: #1c1c22;
      --card-active: #1a1a20;
      --border-color: #27272f;
      --border-active: #3ecf8e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --brand-green: #3ecf8e;
      --brand-green-glow: rgba(62, 207, 142, 0.25);
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1.25rem;
    }

    .container {
      width: 100%;
      max-width: 1280px;
    }

    .header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Accordion Container - Height reduced by 5% (620px -> 589px) */
    .accordion {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    @media (min-width: 992px) {
      .accordion {
        flex-direction: row;
        height: 589px;
      }
    }

    /* Individual Card Panel */
    .panel {
      position: relative;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: flex 0.45s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s ease, border-color 0.3s ease;
    }

    @media (min-width: 992px) {
      .panel {
        flex: 1;
      }
      
      .panel.active {
        flex: 4.5;
        cursor: default;
        background-color: var(--card-active);
        border-color: rgba(62, 207, 142, 0.5);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      }
    }

    /* Progress Tracker Bar on Left Edge */
    .progress-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .progress-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--brand-green);
      box-shadow: 0 0 10px var(--brand-green);
      transition: height 0.6s ease;
    }

    /* Background image layer */
    .panel-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 1;
    }

    .panel.active .panel-bg {
      opacity: 0.12;
    }

    /* Content Layout */
    .panel-content {
      position: relative;
      z-index: 2;
      padding: 1.5rem 1.5rem 1.5rem 2rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }

    /* Header in Panel */
    .panel-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Collapsed state adjustments: only logo and title underneath */
    .panel:not(.active) .panel-content {
      padding: 1.5rem 1rem 1.5rem 1.5rem;
      justify-content: flex-start;
      align-items: center;
    }

    .panel:not(.active) .panel-header {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.75rem;
      width: 100%;
      margin-top: 1rem;
    }

    .panel:not(.active) .collapsed-indicator {
      display: none !important;
    }

    .project-logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #23232c;
      border: 1px solid #32323d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--brand-green);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .project-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .panel:not(.active) .project-title {
      font-size: 1rem;
      word-break: break-word;
    }

    .collapsed-indicator {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--brand-green);
      background: rgba(62, 207, 142, 0.1);
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      margin-left: auto;
    }

    /* Expanded Content scaled down 10% and anchored to lower half */
    .details-view {
      display: none;
      flex-direction: column;
      gap: 1.1rem;
      margin-top: auto;
      transform: scale(0.9);
      transform-origin: bottom left;
      width: 111.11%; /* offsets scale(0.9) to utilize full panel width */
    }

    .panel.active .details-view {
      display: flex;
    }

    .description {
      font-size: 0.95rem;
      line-height: 1.55;
      color: #d1d5db;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric-card {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-value {
      font-size: 1.1rem;
      font-weight: 700;
      font-family: var(--font-mono);
      color: #fff;
    }

    .metric-value.highlight {
      color: var(--brand-green);
    }

    /* Actions: Donation & Contribution */
    .actions-section {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    @media (min-width: 640px) {
      .actions-section {
        grid-template-columns: 1.3fr 1fr;
      }
    }

    .action-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.4rem;
    }

    .wallet-bar {
      display: flex;
      align-items: center;
      background: #111115;
      border: 1px dashed #3a3a46;
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      gap: 0.5rem;
    }

    .wallet-address {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--brand-green);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .btn-copy {
      background: #272732;
      border: none;
      color: #fff;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-copy:hover {
      background: #373746;
    }

      background: var(--brand-green);
      color: #
